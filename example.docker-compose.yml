services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - tuneguess

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Joignable seulement via Caddy. Pour l'admin, publier sur une interface privée,
    # ex. ports: ["127.0.0.1:8080:8080"] puis tunnel SSH.
    expose:
      - "8080"
    depends_on:
      - backend
    networks:
      - tuneguess

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # FRONTEND_URL, CORS_ORIGIN, *_REDIRECT_URI et ADMIN_PASSWORD : dans .env (voir README).
    env_file:
      - .env
    environment:
      PORT: "5000"
      # Caddy et nginx sont sur le réseau Docker : leur X-Forwarded-For donne l'IP du client.
      TRUST_PROXY: "uniquelocal"
    expose:
      - "5000"
    networks:
      - tuneguess

volumes:
  caddy_data:
  caddy_config:

networks:
  tuneguess:
    driver: bridge
